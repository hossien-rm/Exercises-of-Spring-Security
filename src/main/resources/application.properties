spring.application.name=${SPRING_APP_NAME:springsecsection6}

logging.pattern.console=${PATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15})-%msg%n}

logging.level.org.springframework=${SPRING_SECURITY_LOG_LEVEL:INFO}

spring.config.import=application_prod.properties
#say to spring active with prod not default but when we set default in environment have more priority than under.
spring.profiles.active=default

server.servlet.session.timeout=${TIMEOUT_COOKIES:5m}

#
#Connection to DB with Hibernate framework
#
Spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:spring_security}
Spring.datasource.username=${DATABASE_USERNAME:root}
Spring.datasource.password=${DATABASE_PASSWORD:Yrm$1212}
Spring.jpa.show-sql=${JPA_SHOW_SQl:true}
Spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT:true}
spring.jpa.hibernate.ddl-auto=update

